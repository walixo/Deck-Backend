<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Four in a Row — a Deck Games sample</title>
    <!--
      Four in a Row: a two-player game built on Deck Games multiplayer, and the
      sample the developer docs point to. Everything it does goes through the
      public SDK — nothing here is special to Deck's own games.

      How it plays together:
        · Rooms come from Deck: quick match, a private room, or a code.
        · The host's copy is the referee. The guest sends a move to the host;
          the host checks it and publishes the board with setState().
        · Everyone, host included, draws from the `state` event, so a refresh
          or a late arrival picks up the board from the room.
      Opened outside Deck, it falls back to two players on one screen.
    -->
    <script src="%DECK_ORIGIN%/sdk/deck-games-v1.js" data-deck-origins="%DECK_ORIGINS%"></script>
    <style>
      :root {
        --night: #050505; --panel: #0d0d0d; --ink: #f4f2ee; --mute: rgb(244 242 238 / 0.6); --line: rgb(244 242 238 / 0.14);
        --ember: #e8501f; --teal: #5dcaa5; --edge: #f4f2ee;
        --sans: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body { background: var(--night); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased;
        display: flex; justify-content: center; overflow-y: auto; }
      main { width: 100%; max-width: 720px; min-height: 100%; display: flex; flex-direction: column; padding: 18px 16px 20px; gap: 16px; }
      header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
      .brand { font: 700 13px var(--mono); letter-spacing: 0.18em; }
      .brand b { color: var(--ember); }
      .chip { font: 600 11px var(--mono); letter-spacing: 0.12em; text-transform: uppercase; padding: 6px 12px;
        border-radius: 999px; border: 1.5px solid var(--line); color: var(--mute); }
      .view { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 16px; }
      .view[hidden] { display: none; }
      h1 { font-size: clamp(34px, 9vw, 56px); font-weight: 650; letter-spacing: -0.05em; line-height: 0.95; }
      h1 span { color: var(--mute); }
      p.lead { color: var(--mute); font-size: 16px; line-height: 1.5; max-width: 32em; }
      .stack { display: grid; gap: 12px; }
      .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
      button, .btn { font: 650 12px var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: #fff;
        background: var(--ember); border: 1.5px solid var(--edge); border-radius: 6px; box-shadow: 3px 3px 0 var(--edge);
        padding: 14px 18px; cursor: pointer; transition: transform 0.08s, box-shadow 0.08s; }
      button:hover { transform: translate(-1px, -1px); box-shadow: 4px 4px 0 var(--edge); }
      button:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--edge); }
      button.quiet { background: var(--panel); color: var(--ink); }
      button:disabled { opacity: 0.45; cursor: default; transform: none; box-shadow: 3px 3px 0 var(--edge); }
      input { font: 650 20px var(--mono); letter-spacing: 0.3em; text-transform: uppercase; width: 9.5em; padding: 11px 14px;
        border-radius: 6px; border: 1.5px solid var(--edge); background: var(--panel); color: var(--ink); outline: none; }
      input::placeholder { color: rgb(244 242 238 / 0.3); }
      .slab { background: var(--panel); border: 1.5px solid var(--edge); border-radius: 10px; box-shadow: 5px 5px 0 var(--edge); padding: 18px; }
      .label { font: 600 11px var(--mono); letter-spacing: 0.16em; text-transform: uppercase; color: var(--mute); }
      .code { font: 700 clamp(40px, 12vw, 64px) var(--mono); letter-spacing: 0.14em; margin-top: 6px; }
      .seat { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1.5px solid var(--line); font-size: 18px; }
      .seat:first-of-type { border-top: 0; }
      .dot { width: 22px; height: 22px; border-radius: 50%; flex: none; }
      .p1 { background: var(--ember); } .p2 { background: var(--teal); }
      .seat .tag { margin-left: auto; font: 600 12px var(--mono); letter-spacing: 0.1em; color: var(--mute); }
      .seat .tag.ok { color: var(--teal); }
      #note { min-height: 1.4em; color: var(--mute); font-size: 14px; }

      /* The board. Sized to whichever runs out first: the width or the height. */
      .players { display: flex; justify-content: space-between; gap: 12px; }
      .who { display: flex; align-items: center; gap: 10px; font-size: 15px; padding: 8px 12px; border-radius: 999px; border: 1.5px solid transparent; }
      .who.turn { border-color: var(--edge); }
      .who .n { font: 700 15px var(--mono); }
      .stage { flex: 1; min-height: 0; display: grid; place-items: center; }
      .board { position: relative; width: min(100%, calc((100vh - 230px) * 7 / 6), 600px); aspect-ratio: 7 / 6;
        background: var(--panel); border: 2px solid var(--edge); border-radius: 14px; box-shadow: 6px 6px 0 var(--edge);
        display: grid; grid-template-columns: repeat(7, 1fr); grid-template-rows: repeat(6, 1fr); padding: 2.2%; gap: 2.2%; }
      .cell { position: relative; border-radius: 50%; background: var(--night); box-shadow: inset 0 2px 6px rgb(0 0 0 / 0.8); overflow: visible; }
      .disc { position: absolute; inset: 6%; border-radius: 50%; }
      .disc.p1 { background: radial-gradient(circle at 35% 30%, #ff8a5c, var(--ember) 60%); }
      .disc.p2 { background: radial-gradient(circle at 35% 30%, #a6ecd3, var(--teal) 60%); }
      .disc.win { outline: 3px solid var(--edge); outline-offset: 2px; }
      .disc.drop { animation: drop 0.36s cubic-bezier(0.5, 0, 0.75, 1) both; }
      @keyframes drop { from { transform: translateY(calc(var(--fall) * -112%)); } 70% { transform: translateY(0); } 85% { transform: translateY(-6%); } to { transform: translateY(0); } }
      .cols { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(7, 1fr); }
      .cols button { all: unset; cursor: pointer; border-radius: 10px; }
      .cols button:hover:not(:disabled) { background: rgb(244 242 238 / 0.06); }
      .cols button:disabled { cursor: default; }
      .cols button:focus-visible { outline: 2px solid var(--edge); }
      #turn { text-align: center; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; min-height: 1.3em; }
    </style>
  </head>
  <body>
    <main>
      <header><span class="brand"><b>●</b> FOUR IN A ROW</span><span class="chip" id="status">Menu</span></header>

      <!-- Menu: find someone to play. -->
      <section class="view" id="menu">
        <h1>Four in a Row.<br /><span>Line them up first.</span></h1>
        <p class="lead">Drop discs in turn. Four in a line — across, down or diagonal — wins the round.</p>
        <div class="stack" id="online">
          <div class="row">
            <button id="quick">Quick match</button>
            <button class="quiet" id="private">Private room</button>
          </div>
          <div class="row">
            <input id="codeIn" maxlength="6" placeholder="CODE" autocomplete="off" spellcheck="false" aria-label="Room code" />
            <button class="quiet" id="joinBtn">Join</button>
          </div>
        </div>
        <div class="row"><button class="quiet" id="localBtn">Play on one screen</button></div>
      </section>

      <!-- Lobby: a room, waiting for its second player. -->
      <section class="view" id="lobby" hidden>
        <div class="slab">
          <p class="label" id="lobbyLabel">Room code</p>
          <p class="code" id="code">——————</p>
          <p class="lead" style="margin-top: 6px">Friends can enter it in the game, or on Deck at <b>Games → Rooms</b>.</p>
        </div>
        <div class="slab" id="seats"></div>
        <div class="row"><button id="readyBtn">I'm ready</button><button class="quiet" id="leaveLobby">Leave</button></div>
      </section>

      <!-- Play. -->
      <section class="view" id="play" hidden>
        <div class="players">
          <div class="who" id="who0"><span class="dot p1"></span><span id="name0">—</span><span class="n" id="wins0">0</span></div>
          <div class="who" id="who1"><span class="n" id="wins1">0</span><span id="name1">—</span><span class="dot p2"></span></div>
        </div>
        <p id="turn"></p>
        <div class="stage"><div class="board" id="board"><div class="cols" id="cols"></div></div></div>
        <div class="row" style="justify-content: center"><button id="again" hidden>Rematch</button><button class="quiet" id="leavePlay">Leave</button></div>
      </section>

      <p id="note" role="status"></p>
    </main>

    <script>
      const ROWS = 6, COLS = 7;
      const $ = (id) => document.getElementById(id);
      const mp = () => window.DeckGames.multiplayer;

      let deck = { standalone: true };
      let me = null;        // this player's id in this game
      let room = null;      // the room as last heard
      let game = null;      // the shared state: the board and whose turn it is
      let local = false;    // two players, one screen
      let lastDrop = -1;    // the cell to animate
      let starting = false;

      /* ---------------------------------------------------------- rules --- */

      /** A fresh round. `order` is [first colour, second colour] as player ids. */
      function fresh(order, round = 1, wins = [0, 0]) {
        return { board: Array(ROWS * COLS).fill(0), order, turn: (round - 1) % 2, winner: null, line: [], round, wins, last: -1 };
      }

      /** The four (or more) in a line through `at`, or none. */
      function lineThrough(board, at) {
        const who = board[at], r0 = Math.floor(at / COLS), c0 = at % COLS;
        for (const [dr, dc] of [[0, 1], [1, 0], [1, 1], [1, -1]]) {
          const cells = [at];
          for (const sign of [1, -1]) {
            let r = r0 + dr * sign, c = c0 + dc * sign;
            while (r >= 0 && r < ROWS && c >= 0 && c < COLS && board[r * COLS + c] === who) {
              cells.push(r * COLS + c); r += dr * sign; c += dc * sign;
            }
          }
          if (cells.length >= 4) return cells;
        }
        return [];
      }

      /** The round after `who` drops in `col`, or null if that move is not allowed. */
      function play(state, who, col) {
        if (state.winner !== null || who !== state.turn || !(col >= 0 && col < COLS)) return null;
        for (let r = ROWS - 1; r >= 0; r--) {
          const at = r * COLS + col;
          if (state.board[at]) continue;
          const board = state.board.slice();
          board[at] = who + 1;
          const line = lineThrough(board, at);
          const wins = state.wins.slice();
          let winner = null;
          if (line.length) { winner = who; wins[who] += 1; }
          else if (board.every(Boolean)) winner = 'draw';
          return { ...state, board, line, winner, wins, turn: 1 - who, last: at };
        }
        return null;
      }

      /* ----------------------------------------------------- the referee --- */
      // Only the host's copy changes the board. Everyone else asks it to.

      const isHost = () => !local && room && room.hostPlayerId === me;

      function publish(next) {
        game = next;
        render();
        mp().setState(next).catch(report);
      }

      function referee(from, data) {
        if (!isHost() || !game || !data) return;
        if (data.rematch && game.winner !== null) return publish(fresh(game.order, game.round + 1, game.wins));
        const next = play(game, game.order.indexOf(from), Number(data.col));
        if (next) publish(next);
      }

      function begin() {
        if (!isHost() || game) return;
        const order = [room.hostPlayerId, room.players.find((p) => p.playerId !== room.hostPlayerId).playerId];
        publish(fresh(order));
      }

      /* ------------------------------------------------------- the room --- */

      function enter(next) {
        room = next;
        if (next.status === 'playing') {
          if (next.state && !game) game = next.state;
          view('play');
          if (!game) begin();
          render();
        } else {
          view('lobby');
          renderLobby();
        }
      }

      function onRoom(next) {
        room = next;
        if (next.status === 'ended') return backToMenu('The room has closed.');
        if (next.status === 'playing') {
          if (!game && next.state) game = next.state;
          if (next.players.length < 2) say('Your opponent left. Leave to find a new game.');
          render();
          return;
        }
        renderLobby();
        /* Everyone is in and ready: the host starts the game. */
        const all = next.players.length >= next.minPlayers && next.players.every((p) => p.ready);
        if (isHost() && all && !starting) {
          starting = true;
          mp().start().catch(report).finally(() => (starting = false));
        }
      }

      async function online(action) {
        try {
          say('');
          if (!me) me = (await window.DeckGames.session()).playerId;
          enter(await action());
        } catch (error) {
          report(error);
        }
      }

      function backToMenu(message) {
        room = null; game = null; local = false;
        view('menu');
        say(message || '');
      }

      async function leave() {
        if (!local && room) await mp().leave().catch(() => undefined);
        backToMenu();
      }

      /* ---------------------------------------------------- drawing it --- */

      function view(name) {
        for (const id of ['menu', 'lobby', 'play']) $(id).hidden = id !== name;
        $('status').textContent = name === 'menu' ? 'Menu' : name === 'lobby' ? 'Waiting' : local ? 'One screen' : 'Live';
      }

      function say(text) { $('note').textContent = text; }

      function report(error) {
        if (error && error.code === 'signed_out') return say('Sign in to Deck to play online.');
        say((error && error.message) || 'Something went wrong — try again.');
      }

      const nameOf = (id) => (room && room.players.find((p) => p.playerId === id)?.displayName) || 'Waiting…';

      function renderLobby() {
        if (!room) return;
        $('code').textContent = room.code;
        $('lobbyLabel').textContent = room.visibility === 'public' ? 'Public room · code' : 'Private room · code';
        const seats = [];
        for (let i = 0; i < room.maxPlayers; i++) {
          const p = room.players[i];
          seats.push(`<div class="seat"><span class="dot ${i ? 'p2' : 'p1'}"></span><span>${p ? escape(p.displayName) + (p.playerId === me ? ' (you)' : '') : 'Open seat'}</span>
            <span class="tag ${p && p.ready ? 'ok' : ''}">${p ? (p.ready ? '✓ READY' : p.host ? 'HOST' : 'JOINED') : ''}</span></div>`);
        }
        $('seats').innerHTML = seats.join('');
        const mine = room.players.find((p) => p.playerId === me);
        $('readyBtn').textContent = mine && mine.ready ? 'Not ready' : "I'm ready";
      }

      const cells = [];
      for (let i = 0; i < ROWS * COLS; i++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.innerHTML = '<div class="disc"></div>';
        $('board').insertBefore(cell, $('cols'));
        cells.push(cell.firstChild);
      }
      for (let c = 0; c < COLS; c++) {
        const b = document.createElement('button');
        b.setAttribute('aria-label', `Drop in column ${c + 1}`);
        b.addEventListener('click', () => move(c));
        $('cols').appendChild(b);
      }

      function render() {
        if (!game) { $('turn').textContent = 'Setting up the board…'; return; }
        const names = local ? ['Ember', 'Teal'] : game.order.map((id) => (id === me ? 'You' : nameOf(id)));
        for (let i = 0; i < 2; i++) {
          $(`name${i}`).textContent = names[i];
          $(`wins${i}`).textContent = game.wins[i];
          $(`who${i}`).classList.toggle('turn', game.winner === null && game.turn === i);
        }
        game.board.forEach((v, i) => {
          const disc = cells[i];
          disc.className = 'disc' + (v ? ` p${v}` : '') + (game.line.includes(i) ? ' win' : '');
          if (i === game.last && i !== lastDrop) { disc.style.setProperty('--fall', Math.floor(i / COLS) + 1); disc.classList.add('drop'); }
        });
        lastDrop = game.last;

        const mine = local ? game.turn : game.order.indexOf(me);
        if (game.winner === 'draw') $('turn').textContent = 'A draw. The board is full.';
        else if (game.winner !== null) $('turn').textContent = local || game.winner !== mine ? `${names[game.winner]} ${names[game.winner] === 'You' ? 'win' : 'wins'}!` : 'You win!';
        else $('turn').textContent = local ? `${names[game.turn]} to play` : game.turn === mine ? 'Your turn' : `${names[game.turn]} is thinking…`;

        const canMove = game.winner === null && (local || game.turn === mine);
        [...$('cols').children].forEach((b, c) => (b.disabled = !canMove || game.board[c] !== 0));
        $('again').hidden = game.winner === null;
      }

      function move(col) {
        if (!game) return;
        if (local) { const next = play(game, game.turn, col); if (next) { game = next; render(); } return; }
        if (isHost()) return referee(me, { col });
        mp().send({ col }, { to: 'host' }).catch(report);
      }

      function escape(text) { return String(text).replace(/[&<>"']/g, (c) => `&#${c.charCodeAt(0)};`); }

      /* --------------------------------------------------------- wiring --- */

      $('quick').onclick = () => online(() => mp().quickMatch());
      $('private').onclick = () => online(() => mp().create({ visibility: 'private' }));
      $('joinBtn').onclick = () => {
        const code = $('codeIn').value.trim().toUpperCase();
        if (code.length !== 6) return say('Room codes are six characters.');
        online(() => mp().join(code));
      };
      $('codeIn').addEventListener('keydown', (e) => e.key === 'Enter' && $('joinBtn').click());
      $('localBtn').onclick = () => { local = true; room = null; game = fresh(['a', 'b']); lastDrop = -1; view('play'); render(); say(''); };
      $('readyBtn').onclick = () => {
        const mine = room && room.players.find((p) => p.playerId === me);
        mp().setReady(!(mine && mine.ready)).then(onRoom).catch(report);
      };
      $('leaveLobby').onclick = leave;
      $('leavePlay').onclick = leave;
      $('again').onclick = () => {
        if (local) { game = fresh(game.order, game.round + 1, game.wins); render(); }
        else if (isHost()) referee(me, { rematch: true });
        else mp().send({ rematch: true }, { to: 'host' }).catch(report);
      };

      (async () => {
        if (window.DeckGames) deck = await window.DeckGames.init();
        if (deck.standalone) {
          $('online').hidden = true;
          say('Open Four in a Row on Deck to play online. Here, two of you can share a screen.');
          view('menu');
          return;
        }
        me = deck.player ? deck.player.playerId : null;
        const on = window.DeckGames.on;
        on('room', onRoom);
        on('started', (next) => { room = next; view('play'); begin(); render(); });
        on('state', ({ state }) => { if (local) return; game = state; if (room && room.status === 'playing') view('play'); render(); });
        on('message', ({ from, data }) => referee(from, data));
        on('ended', () => backToMenu('The room has closed.'));

        view('menu');
        if (deck.invite) online(() => mp().join(deck.invite));
        else {
          /* Back after a refresh: pick the room up where it was. */
          const current = await mp().room().catch(() => null);
          if (current && current.status !== 'ended') { me = me || deck.player?.playerId; enter(current); }
        }
        window.DeckGames.ready();
      })();
    </script>
  </body>
</html>
