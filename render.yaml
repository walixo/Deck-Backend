# Render blueprint for Deck's API.
#
# This file has to live at the root of the repository Render clones, which is
# `walixo/Deck-Backend` — the backend is its own repo, so this sits beside
# package.json rather than a directory up. There is no `rootDir` for the same
# reason: the repo root *is* the project.
#
# Checked in rather than clicked into the dashboard, so the configuration is
# reviewable and reproducible. Secrets are not here: everything marked
# `sync: false` is prompted for on first deploy and then lives in Render's own
# store.
services:
  - type: web
    name: deck-api
    runtime: node
    plan: starter

    # Two failures are encoded in this one line, both of them real.
    #
    # `npm install` alone was the dashboard default, and nothing in it compiles
    # TypeScript — so `dist/server.js` never existed and the start command had
    # nothing to run.
    #
    # `--include=dev` is the second. `NODE_ENV: production` is set below for the
    # *run*, but Render applies a service's environment to the *build* as well,
    # and npm reads `NODE_ENV=production` as "skip devDependencies". TypeScript
    # is a devDependency, so it was never installed — and `tsc` then resolved to
    # whatever TypeScript happens to be global on the build image, which is a
    # major version ahead and rejects this project's `moduleResolution`. The
    # error it produced named tsconfig.json and looked nothing like a missing
    # dependency.
    #
    # `--include=dev` says what is meant regardless of NODE_ENV. `npm ci` rather
    # than `npm install` because it installs exactly the lockfile, which is the
    # point of keeping one.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start

    healthCheckPath: /api/health

    # No disk. Images go to Cloudinary, so nothing is written to the container
    # filesystem and a deploy wiping it costs nothing.

    envVars:
      - key: NODE_ENV
        value: production

      # Render provides PORT and the server reads it.

      - key: TRUST_PROXY
        # Render terminates TLS in front of the process, so X-Forwarded-For is
        # the proxy's word and can be believed. Without this every audit entry
        # records the load balancer's address, and the login rate limiter
        # buckets the whole internet into a single counter.
        value: 1

      - key: JWT_SECRET
        # Generated by Render and kept there. Never printed, never in the repo.
        # Rotating it signs everyone out, which is correct for a leaked key.
        generateValue: true

      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_CALLBACK_URL
        sync: false
      - key: CURRENCY
        value: NGN
